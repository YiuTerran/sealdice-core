name: Test & Lint

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test-and-lint:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.10.0
          run_install: false

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: sealdice-ui/pnpm-lock.yaml

      - name: Build pinned UI resources
        working-directory: sealdice-ui
        run: |
          pnpm install --frozen-lockfile
          pnpm run build-only
          rm -rf ../static/frontend
          mkdir -p ../static/frontend
          cp -a dist/. ../static/frontend/

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - run: go mod download
      - run: go generate ./signature

      - run: go test -v -race ./...
      - run: go vet ./...

      - name: GolangCI-Lint
        uses: golangci/golangci-lint-action@v8
        if: github.event_name != 'pull_request'
        with:
          version: v2.14.0
          args: '--timeout 10m'
